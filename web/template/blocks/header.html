{{ define "header" }}
<header>
  <div class="page-wrapper">
    <div class="container">
      <div class="flex gap-8 align-center wrap">
        <div class="logo">jonasluethi.dev</div>
        <div class="nav-items grow flex gap-8">
          {{ range .Navigation.Items }}
          <a href="{{ .Href }}" {{ if .Active }}class="active" {{ end }}
            >{{ .Name }}</a
          >
          {{ end }}
        </div>
      </div>
    </div>
  </div>
</header>
<hr class="seperator" />
{{ end }}
